upstream app {
    # Path to Puma SOCK file, as defined previously
    server unix:///home/root/apps/teacher_crm/shared/tmp/sockets/teacher_crm-puma.sock;
}

server {
    listen 80;
    listen [::]:80;

    # listen [::]:443 ssl ipv6only=on;
    # listen 443 ssl;

    server_name 138.68.102.223;

    root /home/root/apps/teacher_crm/current/public;

    rewrite ^/(.*)/$ /$1 permanent; # remove trailing slashes

    try_files $uri/index.html $uri @app;

    location @app {
        proxy_pass http://app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    location /cable {
        proxy_pass http://app/cable;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    error_page 500 502 503 504 /500.html;
    client_max_body_size 4G;
    keepalive_timeout 10;
}
